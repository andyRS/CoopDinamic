<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>MENSAJE</title>

    <style>
       @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,300&display=swap');

        body {
            padding: 0%;
            margin: 0;
            outline: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
            background: rgb(220, 247, 148);
        }

        #mensaje_enviado {
            display: flex;
            width: 60%;
            background: rgb(33, 192, 67);
            align-items: center;
            justify-content: center;
            margin: 0px auto;
            margin-top: 250px;
            color: #fff;
        }

        #mensaje_enviado h1{
            font-weight: 700;
            text-shadow: 1px 1px 1px #444;
            font-size: 40px;
        }

         a{
            display: block;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 25px;
            font-weight: 700;
            color: rgb(46, 46, 236);
            position: relative;
            top: 80px;
            left: -252px;
            transition: all 300ms;
        }

        a:hover{
            transform: scale(1.2);
            background: rgb(20, 20, 170);
            top: 110px;
            color: #fff;
        }
    </style>
</head>

<body>
    <section id="mensaje_enviado">
        <h1>Gracias por escribirnos</h1>
        
        <a class="btn-volver" href="index.html">volver</a>
    </section>

</body>

</html>
