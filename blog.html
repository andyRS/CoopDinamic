<!DOCTYPE html>
<html lang="es-ES">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog CoopDinamica</title>
    <!--incio de favicon, icono de la web -->
    <link rel="shortcut icon" href="img/favico.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <!--fin de favicon, icono de la web -->

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!--inicio de los mediaQuerys (Responsive) -->
    <link rel="stylesheet" href="css/querys-responsivo.css">
    <!--fin de los mediaQuerys (Responsive) -->

     <!--inicio de mis estilos CSS -->
     <link rel="stylesheet" href="css/blogs-articles.css">
     <!--fin de mis estilos CSS -->


    <!--Inicio Script para iconos de font-awesome -->
    <script src="https://kit.fontawesome.com/a998cb1e07.js" crossorigin="anonymous"></script>
    <!--fin Script para iconos de font-awesome -->


    <!--Inicio Scripts de la web -->

    <script type="text/javascript" src="js/loader.js"></script>
    <script type="text/javascript" src="js/app.js"></script>
    <script type="module" src="js/react-components.js"></script>


    <!--Fin Script de la web -->
</head>

<body>
    <div data-component="loader"></div>

    <!--inicio contenedor principal de todo el conenido-->
    <section id="container" class="container-fluid">
        <div data-component="header" data-logo-text="CoopDinámica" data-logo-title="Cooperativa Dinamica"
            data-search-variant="inline"></div>

        <div data-component="nav-menu" data-nav-variant="blog"></div>

        <!--Inicio Slider(Background) principal-->
        <div id="slider" class="slider-big">
            <h2>Cooperativa de Ahorros y prestamos la Dinamica</h2>
            <a href="" class="btn-white">Unete hoy!</a>
        </div>
        <!--Fin Slider(Background) principal-->

        <!--Inicio seccion Articulos-->
        <div class="center">
            <section id="content">
                <h2 class="subheader">Ultimos articulos</h2>
                <!--Listado de articulos-->
                <div id="articles">
                    <article class="article-item" id="article-template">
                        <div class="image-wrap">
                            <img src="https://blog.foto24.com/wp-content/uploads/2021/08/Fotograf%C3%ADas_Paisajes_Marinos_1200x675_port.jpg"
                                alt="Paisaje">
                        </div>

                        <h2>Articulo Prueba</h2>
                        <span class="date">
                            Hace 5 minutos
                        </span>
                        <a href="#">Leer mas</a>

                        <div class="clearfix"></div>
                    </article>
                    <!--Añadir articulos via JS-->
                </div>
                <div class="clearfix"></div>    
            </section>

            <aside id="sidebar">
                <div id="nav-blog" class="sidebar-item">
                    <h3>Conoce mas sobre nosotros</h3>
                    <a href="#" class="btn btn-success">CoopDinámica</a>
                </div>

            </aside>
            <div class="clearfix"></div>
        </div>
        <!--Fin seccion Articulos-->

        <div data-component="footer"></div>


    </section>
    <!--Fin contenedor principal de todo el conenido-->
    <script type="text/javascript" src="js/components.js"></script>

</body>

</html>
