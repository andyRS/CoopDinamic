<body>
    <div data-component="loader"></div>

    <!--inicio contenedor principal de todo el conenido-->
    <section id="container" class="container-fluid">
        <div data-component="header" data-logo-text="CoopDinámica" data-logo-title="Cooperativa Dinamica"
            data-search-variant="inline"></div>

        <div data-component="nav-menu" data-nav-variant="blog"></div>

                </div>
