<!DOCTYPE html>
<html lang="es-ES">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formluario de contacto</title>
    <link href="css/formulario.css" rel="stylesheet" />

    <!--inicio de los mediaQuerys (Responsive) -->

    <!--fin de los mediaQuerys (Responsive) -->

    <!--incio de favicon, icono de la web -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <!--fin de favicon, icono de la web -->

    <!--Inicio Jquery para proyectos -->
    <script type="text/javascript" src="js/Jquery/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="js/Jquery/jquery.sdq.js"></script>
    <!--Fin Jquery para proyectos -->

    <!--Inicio Script para iconos de font-awesome -->
    <script src="https://kit.fontawesome.com/a998cb1e07.js" crossorigin="anonymous"></script>
    <!--fin Script para iconos de font-awesome -->

    <!--Inicio Scripts de la calculadora -->
    <script src="js/Display.js" type="text/javascript"></script>
    <script src="js/Calculadora.js" type="text/javascript"></script>
    <script src="js/index.js" type="text/javascript" defer></script>
    <script type="text/javascript" src="js/loader.js"></script>
    <script type="text/javascript" src="js/validate-form.js"></script>

    <!--Fin Scripts de la calculadora -->
</head>

<body>
    <div data-component="loader"></div>

    <!--inicio contenedor principal de todo el conenido-->
    <section id="container">
        <div data-component="header" data-logo-text="COOP DINAMICA" data-logo-title="Cooperativa Dinamica"
            data-search-variant="span"></div>

        <div data-component="nav-menu" data-nav-variant="default"></div>

        <!--Inicio del Formulario de contacto-->
        <section id="container-form-contact">
            <h2>Formulario de conctacto</h2>

            <div class="contenido">
                <div class="info">
                    <div class="col">
                        <i class="icono fas fa-map-marker-alt"></i>
                        <p>Av. 26 de Julio Nro. 8 Cuidad - Pais</p>
                    </div>

                    <div class="col">
                        <i class="fas fa-envelope icono"></i>
                        <p>coopdinamica@correo.com</p>
                    </div>

                    <div class="col">
                        <i class="fas fa-phone icono"></i>
                        <p>(+1) 809-455-2020 <br /> (+1) 809-555-3030</p>
                    </div>

                    <div class="redes-s">
                        <a href=""><i class="fab fa-facebook"></i></a>
                        <a href=""><i class="fab fa-twitter"></i></a>
                        <a href=""><i class="fab fa-instagram"></i></a>
                    </div>
                </div>

                <form action="enviado.html" method="GET" class="formulario" id="formulario">
                    <div id="form-messages" class="form-alert" aria-live="polite"></div>
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" placeholder="Nombre" id="nombre" autocomplete="name">
                    <label for="cedula">Cedula</label>
                    <input type="text" name="cedula" placeholder="Cedula sin guiones" id="cedula">
                    <label for="correo">Correo electronico</label>
                    <input type="email" name="correo" placeholder="Correo electronico" id="correo" required minlength="6"
                        pattern="^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$" autocomplete="email">
                    <label for="telefono">Telefono</label>
                    <input type="tel" name="telefono" placeholder="Telefono sin guiones" id="telefono" autocomplete="tel">
                    <label for="asunto">Asunto</label>
                    <input type="text" name="asunto" placeholder="Asunto" id="asunto">
                    <label for="mensaje">Mensaje</label>
                    <textarea name="mensaje" id="mensaje" placeholder="Mensaje"></textarea>
                    <button type="submit" id="validarCedula">Enviar</button>
                    <button type="reset" id="limpiarFormluario" value="Limpiar formulario">Limpiar Campos</button>
                </form>
            </div>
        </section>
        <!--Fin del Formulario de contacto-->

        <div data-component="footer"></div>


    </section>
    <script type="text/javascript" src="js/components.js"></script>

</body>

</html>
