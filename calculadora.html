<!DOCTYPE html>
<html lang="es-ES">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces&display=swap" rel="stylesheet">
    <link href="css/calculadora.css" rel="stylesheet" />
     <!--inicio de los mediaQuerys (Responsive) -->
    
     <!--fin de los mediaQuerys (Responsive) -->
    <!--incio de favicon, icono de la web -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <!--fin de favicon, icono de la web -->

    <!--Inicio Script para iconos de font-awesome -->
    <script src="https://kit.fontawesome.com/a998cb1e07.js" crossorigin="anonymous"></script>
    <!--fin Script para iconos de font-awesome -->

    

    <!--Inicio Scripts de la calculadora -->
    <script src="js/Display.js" type="text/javascript"></script>
    <script src="js/Calculadora.js" type="text/javascript"></script>
    <script src="js/index.js" type="text/javascript" defer></script>
    <script type="text/javascript" src="js/loader.js"></script>
     <!--Fin Scripts de la calculadora -->
</head>
<body>
     <div data-component="loader"></div>

     <!--inicio contenedor principal de todo el conenido-->
     <section id="container" class="container-fluid">
        <div data-component="header" data-header-class="container-fluid" data-logo-text="CoopDinámica"
            data-logo-title="Cooperativa Dinamica" data-search-variant="inline"></div>

        <div data-component="nav-menu" data-nav-variant="calculadora"></div>


    <!--Inicio contenedor principal calculadora Normal-->
    <div class="container">
        <div class="calculadora">
            <div class="display">
                <div id="valor-anterior"></div>
                <div id="valor-actual"></div>
            </div>
            <button class="col-2" onclick="display.borrarTodo()">C</button>
            <button onclick="display.borrar()">&larr;</button>
            <button class="operador" value="dividir">%</button>
            <button class="numero">7</button>
            <button class="numero">8</button>
            <button class="numero">9</button>
            <button class="operador" value="multiplicar">X</button>
            <button class="numero">4</button>
            <button class="numero">5</button>
            <button class="numero">6</button>
            <button class="operador" value="restar">-</button>
            <button class="numero">1</button>
            <button class="numero">2</button>
            <button class="numero">3</button>
            <button class="operador" value="sumar">+</button>
            <button class="col-2 numero">0</button>
            <button class="numero">.</button>
            <button class="operador" value="igual">=</button>
        </div>
    </div>
    <!--Fin contenedor principal calculadora Normal-->

        <div data-component="footer"></div>
    </section>
    <!--Fin contenedor principal de todo el conenido-->
    <script type="text/javascript" src="js/components.js"></script>

</body>
</html>
