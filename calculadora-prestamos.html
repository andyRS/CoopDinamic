<!DOCTYPE html>
<html lang="es-ES">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de prestamos</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link href="css/calculadora-prestamos.css" rel="stylesheet" />


    <!--inicio de los mediaQuerys (Responsive) -->

    <!--fin de los mediaQuerys (Responsive) -->

    <!--incio de favicon, icono de la web -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <!--fin de favicon, icono de la web -->

    <!--Inicio Jquery para proyectos -->
    <script type="text/javascript" src="js/Jquery/jquery-3.6.0.min.js"></script>
    <!--Fin Jquery para proyectos -->

    <!-- llamada a bootstrap -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>


    <!--Inicio Script para iconos de font-awesome -->
    <script src="https://kit.fontawesome.com/a998cb1e07.js" crossorigin="anonymous"></script>
    <!--fin Script para iconos de font-awesome -->

    <!--Inicio Scripts de la calculadora -->
    <script src="js/Display.js" type="text/javascript"></script>
    <script src="js/Calculadora.js" type="text/javascript"></script>
    <script src="js/index.js" type="text/javascript" defer></script>
    <script type="text/javascript" src="js/loader.js"></script>
    <script type="text/javascript" src="js/validate-form.js"></script>
    <script src="js/amortizacion.js"></script>
    <script src="js/moment.js"></script>
    <!--Fin Scripts de la calculadora -->


</head>

<body>
    <div data-component="loader"></div>

    <!--inicio contenedor principal de todo el conenido-->
    <section id="container">
        <div data-component="header" data-logo-text="COOP DINAMICA" data-logo-title="Cooperativa Dinamica"
            data-search-variant="span"></div>

        <div data-component="nav-menu" data-nav-variant="prestamos"></div>

        <!--Inicio de calculadora de prestamos-->
        <div class="container-fluid">
            <div class="row mt-3">
                <div class="col-6 mb-4">
                    <h2 class="h2-title">Calculadora de Préstamos</h2>
                    <div class="form-group">
                        <input type="text" class="form-control placeholder col-6" id="monto"
                            placeholder="Ingresar monto">
                    </div>
                    <div class="form-group">

                        <input type="text" class="form-control placeholder col-6" id="tiempo"
                            placeholder="Ingresar cantidad de meses">
                    </div>
                    <div class="form-group">

                        <input type="text" class="form-control placeholder col-6" id="interes"
                            placeholder="Ingresar tasa de interés mensual">
                    </div>
                    <button type="submit" class="btn btn-success col-3" id="btnCalcular">Calcular</button>
                    <button class="btn btn-warning  col-3 " id="btnLimpiar">Limpiar</button>
                </div>
                <div class="col-6">
                    <table id="lista-tabla" class="table">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">Fecha</th>
                                <th scope="col">Cuota</th>
                                <th scope="col">Capital</th>
                                <th scope="col">Interés</th>
                                <th scope="col">Saldo</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div data-component="footer" data-footer-variant="simple"></div>
    </section>
    <script type="text/javascript" src="js/components.js"></script>

</body>

</html>
